version: 2.1

orbs:
  python: circleci/python@2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.10
    environment:
      OPENAI_API_KEY: "fake-key-for-testing"
      FLASK_ENV: "testing"
      PYTHONUNBUFFERED: "1"
    steps:
      - checkout:
          path: ~/project

      - run:
          name: Update Git Submodules
          command: |
            git submodule update --init --recursive
            cd external/ai_convo_client && git checkout hw3
            cd ../issue_tracker && git checkout hw4-jt3-fix-path
            cd ../../

      - run:
          name: Install uv
          command: curl -LsSf https://astral.sh/uv/install.sh | sh

      - python/setup:
          pkg-manager: uv

      - run:
          name: Set Environment Variables
          command: |
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
            echo "export PYTHONPATH=$PWD/src:$PWD/external/ai_convo_client/ai_conversation_client" >> $BASH_ENV
            echo "export MYPYPATH=$PWD/external/ai_convo_client/ai_conversation_client" >> $BASH_ENV

      - run:
          name: Install Dependencies
          command: |
            uv sync --group dev

      - run:
          name: Run Static Analysis
          command: |
            mypy src
            ruff check . --config pyproject.toml

      - run:
          name: Initialize Test Database with Flask CLI
          command: |
            export FLASK_APP=app.py
            export DB_TYPE=sqlite
            export DB_PATH=test.db
            
            # Initialize database using app's CLI commands
            echo y | flask drop-db
            flask init-db
            flask seed-ai-bot

      - run:
          name: Run All Tests with pytest
          command: |
            mkdir -p test-results
            python -m pytest \
              src/ \
              tests/ \
              --cov=src \
              --cov-report=xml:coverage-reports/coverage.xml \
              --cov-report=html:coverage-reports/html \
              --junitxml=test-results/junit.xml \
              -v

      - run:
          name: Check Coverage Threshold
          command: |
            coverage report --fail-under=50

      - store_test_results:
          path: test-results

      - store_artifacts:
          path: coverage-reports
          destination: coverage

workflows:
  main:
    jobs:
      - build-and-test