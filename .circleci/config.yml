version: 2.1

orbs:
  python: circleci/python@2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.10
    steps:
      - checkout

      - run:
          name: Install uv
          command: curl -LsSf https://astral.sh/uv/install.sh | sh

      - run:
          name: Create and Activate Virtual Environment
          command: |
            uv venv .venv
            echo 'export PATH=".venv/bin:$PATH"' >> $BASH_ENV
            echo "export PYTHONPATH=$PWD/src" >> $BASH_ENV
            source .venv/bin/activate

      - run:
          name: Install Dependencies
          command: |
            uv pip install ".[dev]"
            uv pip install mypy ruff nose2 coverage

      - run:
          name: Cleanup old coverage data
          command: |
            coverage erase
            rm -f .coverage*

      - run:
          name: Run Static Analysis
          command: |
            mypy src tests
            ruff check . --config pyproject.toml

      - run:
          name: Run Unit Tests with Coverage
          command: |
            mkdir -p test-results/unit
            COVERAGE_FILE=.coverage.calculator nose2 -v -s src/calculator/test/ --with-coverage --coverage=src.calculator --plugin=nose2.plugins.junitxml --junit-xml-path=test-results/unit/calculator.xml
            COVERAGE_FILE=.coverage.logger nose2 -v -s src/logger/test/ --with-coverage --coverage=src.logger --plugin=nose2.plugins.junitxml --junit-xml-path=test-results/unit/logger.xml
            COVERAGE_FILE=.coverage.notifier nose2 -v -s src/notifier/test/ --with-coverage --coverage=src.notifier --plugin=nose2.plugins.junitxml --junit-xml-path=test-results/unit/notifier.xml
            COVERAGE_FILE=.coverage.channel nose2 -v -s src/channel/test/ --with-coverage --coverage=src.channel --plugin=nose2.plugins.junitxml --junit-xml-path=test-results/unit/channel.xml
            COVERAGE_FILE=.coverage.message nose2 -v -s src/message/test/ --with-coverage --coverage=src.message --plugin=nose2.plugins.junitxml --junit-xml-path=test-results/unit/message.xml
            COVERAGE_FILE=.coverage.user nose2 -v -s src/user/test/ --with-coverage --coverage=src.user --plugin=nose2.plugins.junitxml --junit-xml-path=test-results/unit/user.xml

      - run:
          name: Run Integration Tests
          command: |
            mkdir -p test-results/integration
            COVERAGE_FILE=.coverage.integration PYTHONPATH=src python -m nose2 -s tests/integration --with-coverage --plugin=nose2.plugins.junitxml --junit-xml-path=test-results/integration/results.xml


      - run:
          name: Run End-to-End Tests
          command: |
            mkdir -p test-results/e2e
            COVERAGE_FILE=.coverage.e2e PYTHONPATH=src python -m nose2 -s tests/e2e/ --with-coverage --plugin=nose2.plugins.junitxml --junit-xml-path=test-results/e2e/results.xml

      - run:
          name: Combine Coverage Reports
          command: |
            mkdir -p coverage-reports
            coverage combine .coverage.calculator .coverage.logger .coverage.notifier .coverage.integration .coverage.e2e
            # Store the combined raw coverage data file
            cp .coverage coverage-reports/combined.coverage
            coverage report --fail-under=70
            coverage xml -o coverage-reports/coverage.xml
            coverage html -d coverage-reports/html

      - store_test_results:
          path: test-results

      - store_artifacts:
          path: coverage-reports
          destination: coverage

workflows:
  main:
    jobs:
      - build-and-test