version: 2.1

orbs:
  python: circleci/python@2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.10
    steps:
      - checkout

      - run:
          name: Install uv
          command: curl -LsSf https://astral.sh/uv/install.sh | sh

      - run:
          name: Create and Activate Virtual Environment
          command: |
            uv venv .venv
            echo 'export PATH=".venv/bin:$PATH"' >> $BASH_ENV
            echo "export PYTHONPATH=$PWD/src:$PWD/tests" >> $BASH_ENV
            source .venv/bin/activate

      - run:
          name: Install Dependencies
          command: |
            uv pip install ".[dev]"
            uv pip install mypy ruff nose2 coverage

      - run:
          name: Cleanup old coverage data
          command: |
            coverage erase
            rm -f .coverage*

      - run:
          name: Run Static Analysis
          command: |
            mypy src tests
            ruff check . --config pyproject.toml

      - run:
          name: Run Unit Tests
          command: |
            touch .coverage.unit
            COVERAGE_FILE=.coverage.unit nose2 -v -s tests/unit/ --with-coverage --coverage=src --coverage=tests
            coverage report -m > unit-coverage.txt
            coverage html -d unit-htmlcov
            coverage xml -o unit-coverage.xml

      - run:
          name: Run Integration Tests
          command: |
            touch .coverage.integration
            COVERAGE_FILE=.coverage.integration nose2 -v -s tests/integration/ --with-coverage --coverage=src --coverage=tests
            coverage report -m > integration-coverage.txt
            coverage html -d integration-htmlcov
            coverage xml -o integration-coverage.xml

      - run:
          name: Run End-to-End Tests
          command: |
            touch .coverage.e2e
            COVERAGE_FILE=.coverage.e2e nose2 -v -s tests/e2e/ --with-coverage --coverage=src --coverage=tests
            coverage report -m > e2e-coverage.txt
            coverage html -d e2e-htmlcov
            coverage xml -o e2e-coverage.xml

      - run:
          name: Final Coverage Report (Combined)
          command: |
            coverage combine .coverage.unit .coverage.integration .coverage.e2e || echo "No coverage files found!"
            coverage report -m > total-coverage.txt
            coverage xml -o total-coverage.xml
            coverage html -d total-htmlcov

      - store_test_results:
          path: test-results

      - store_artifacts:
          path: unit-htmlcov
          destination: unit-coverage-report
      - store_artifacts:
          path: integration-htmlcov
          destination: integration-coverage-report
      - store_artifacts:
          path: e2e-htmlcov
          destination: e2e-coverage-report

      - store_artifacts:
          path: total-htmlcov
          destination: total-coverage-report

      - store_artifacts:
          path: unit-coverage.txt
          destination: text-reports/unit-coverage.txt
      - store_artifacts:
          path: integration-coverage.txt
          destination: text-reports/integration-coverage.txt
      - store_artifacts:
          path: e2e-coverage.txt
          destination: text-reports/e2e-coverage.txt
      - store_artifacts:
          path: total-coverage.txt
          destination: text-reports/total-coverage.txt

      - store_artifacts:
          path: unit-coverage.xml
          destination: coverage-reports/unit-coverage.xml
      - store_artifacts:
          path: integration-coverage.xml
          destination: coverage-reports/integration-coverage.xml
      - store_artifacts:
          path: e2e-coverage.xml
          destination: coverage-reports/e2e-coverage.xml
      - store_artifacts:
          path: total-coverage.xml
          destination: coverage-reports/total-coverage.xml

workflows:
  main:
    jobs:
      - build-and-test