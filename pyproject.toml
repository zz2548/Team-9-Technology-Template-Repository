[project]
name = "technology-template-repository"
version = "0.1.0"
description = "A Python project template."
authors = [
    { name = "Jerry Zou", email = "zz2548@nyu.edu" },
    { name = "Keshav Rajput", email = "kr3412@nyu.edu" },
    { name = "Terry Xu", email = "xm2204@nyu.edu" },
    { name = "Jinglin Tao", email = "jt4296@nyu.edu" }
]
license = { file = "LICENSE" }
requires-python = ">=3.10.9, <3.11"

dependencies = [
    "flask",
    "flask-sqlalchemy",
    "flask-login",
    "flask-bcrypt",
    "flask-cors>=5.0.1",
    "openai>=1.3.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.8.5",
    "httpx<0.27",
    "PyJWT"
]

[project.optional-dependencies]
dev = [
    "coverage>=7.6.12",
    "mypy>=1.15.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "nose2>=0.15.1",
    "ruff>=0.9.6",
    "pre-commit>=4.1.0",
    "pytest-asyncio>=0.21.1"
]


[tool.ruff]
line-length = 120
target-version = "py310"
fix = true
exclude = [
    ".venv",
    "build",
    "dist",
    "external",  # <-- ignore everything in external/ (submodules)
]
[tool.ruff.lint]
select = ["ALL"]  # Enable all available linting rules

# Consolidated ignore list - removing duplicates
ignore = [
    # Basic formatting
    "E402",  # Module level import not at top of file
    "E501",  # Line too long (handled by line-length setting)
    "W291",  # Trailing whitespace
    "W293",  # Blank line contains whitespace

    # Docstring rules
    "D100",  # Missing docstring in public module
    "D101",  # Missing docstring in public class
    "D102",  # Missing docstring in public method
    "D103",  # Missing docstring in public function
    "D104",  # Missing docstring in public package
    "D107",  # Missing docstring in __init__
    "D200",  # Allow longer docstrings
    "D203",  # One blank line required before class docstring
    "D205",  # One blank line required between summary and description
    "D212",  # Multi-line docstring summary should start at the first line
    "D400",  # First line should end with a period
    "D401",  # First line should be in imperative mood
    "D415",  # First line should end with a period, question mark, or exclamation

    # Import and unused variables
    "F401",  # Imported but unused
    "UP035",  # Deprecated import

    # Type annotations
    "ANN001",  # Missing type annotation for function argument
    "ANN201",  # Missing return type annotation for public function
    "ANN204",  # Missing return type annotation for special method
    "ANN401",  # Allow Any return types

    # Exception handling
    "BLE001",  # Blind exception catching allowed
    "EM101",  # Exception must not use a string literal
    "EM102",  # Exception must not use an f-string literal
    "TRY003",  # Avoid specifying long messages outside exception class
    "TRY300",  # Not strict about else blocks after try
    "TRY400",  # Use logging exception instead of error

    # Code complexity
    "ARG002",  # Unused method argument
    "ASYNC230",  # Async-related rules
    "C901",     # Function is too complex
    "PLR0911",  # Too many return statements
    "PLR0912",  # Too many branches
    "PLR0913",  # Too many arguments for function
    "PLR0915",  # Too many statements
    "PLR2004",  # Magic value used in comparison
    "RET504",   # Return assignment not needed
    "SLF001",   # Private member accessed

    # Testing
    "S101",  # Use of assert detected (needed for test cases)
    "PT009",  # Use of unittest.TestCase with pytest
    "PT011",  # Pytest.raises is too broad
    "PT027",  # Use pytest.raises instead of unittest-style assertRaises

    # TODOs
    "FIX002",  # Line contains TODO
    "TD002",   # Missing author in TODO
    "TD003",   # Missing issue link in TODO

    # Miscellaneous
    "A002",      # Argument shadowing a Python builtin
    "DTZ005",    # Timezone related
    "EXE001",    # Executable file
    "G004",      # Logging statement uses f-string
    "PTH123",    # Path related
    "TC003",     # Type checking
    "T201",      # Print statement found
]

[tool.ruff.lint.per-file-ignores]
"tests/integration/test_channel.py" = ["PLW0603", "PLW0602"]
"tests/integration/test_message_flow.py" = ["PLW0603", "PLW0602"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
warn_unreachable = true
strict_optional = true
explicit_package_bases = true
exclude = [
    '.venv',
    'build',
    'dist',
    "src/__init__.py",
    ".*test.*",
    ".*/test/.*",
    ".*/tests/.*",
    "src/models/.*",
    "external/.*",
]

disable_error_code = [
    "no-untyped-call",
    "no-untyped-def",
]


[tool.pytest.ini_options]
addopts = "--ignore-glob='*nose2*.py'" # Ignore the nose2 files
pythonpath = [
    "src"
]
testpaths = [
    "src",
    "tests"
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "tests/*", ".venv/*", "build/*", "dist/*", "*/test/*", "*/pre_commit_test.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise AssertionError",
]
ignore_errors = true
fail_under = 50

[tool.uv.sources]
technology-template-repository = { workspace = true }


[dependency-groups]
dev = [
    "coverage>=7.6.12",
    "mypy>=1.15.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "nose2>=0.15.1",
    "ruff>=0.9.6",
    "pre-commit>=4.1.0",
    "flask",
    "flask-sqlalchemy",
    "flask-cors>=5.0.1",
    # From AI Client
    "pytest-asyncio>=0.21.1",
    "openai>=1.3.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.8.5 ",
    "dotenv>=0.9.9",
    "python-dotenv==1.1.0",
]

