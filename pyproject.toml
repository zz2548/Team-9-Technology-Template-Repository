[project]
name = "technology-template-repository"
version = "0.1.0"
description = "A Python project template."
authors = [
    { name = "Jerry Zou", email = "zz2548@nyu.edu" },
    { name = "Keshav Rajput", email = "kr3412@nyu.edu" },
    { name = "Terry Xu", email = "xm2204@nyu.edu" },
    { name = "Jinglin Tao", email = "jt4296@nyu.edu" }
]
license = { file = "LICENSE" }
requires-python = ">=3.10.9, <3.11"


[project.optional-dependencies]
dev = [
    "coverage>=7.6.12",
    "mypy>=1.15.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "nose2>=0.15.1",
    "ruff>=0.9.6",
    "pre-commit>=4.1.0",
    "flask",
    "flask-sqlalchemy",
    "flask-cors>=5.0.1",
    # From AI Client
    "pytest-asyncio>=0.21.1",
    "openai>=1.3.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.8.5 ",
    "dotenv>=0.9.9",
    "python-dotenv==1.1.0",
]


[tool.ruff]
line-length = 120
target-version = "py310"
fix = true
exclude = [
    ".git", ".venv", "build", "dist",
]
extend-ignore = [
  "E501",  # Already handled by increasing line-length
  "BLE001",  # Blind exception catching allowed (for startup code like your singleton)
  "TRY300",  # Not strict about else blocks after try
  "D205",  # Not strict about docstring formatting
  "TRY400",
  "G004"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["ALL"]  # Enable all available linting rules
ignore = [
    "E402",
    # Docstring-related rules
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D104", # Missing docstring in public package
    "D107", # Missing docstring in __init__
    "D203", # One blank line required before class docstring
    "D212", # Multi-line docstring summary should start at the first line

    # Code quality rules
    "T201", # Print statement found
    "S101", # Use of assert detected, need this for test cases
    "PLR2004", # Magic value used in comparison, need this for test cases
    "TRY003", # Avoid specifying long messages outside exception class
    "EM101", # Exception must not use a string literal, assign to variable first
    "PLR0913", # Allow more than 5 arguments for functions


    # TODO-related rules
    "FIX002", # Line contains TODO, we will allow TODOs
    "TD002", # Missing author in TODO
    "TD003", # Missing issue link in TODO

    # pytest with unittest related rules
    "PT009", # Use of unittest.TestCase with pytest
    "PT027", # Use pytest.raises instead of unittest-style assertRaises
    "PT011", # Pytest.raises is too broad

    # Type Annotation
    "ANN001", # Missing type annotation for function argument
    "ANN201", # Missing return type annotation for public function
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_optional = true
explicit_package_bases = true
exclude = [
    '.venv',
    'build',
    'dist',
    "src/__init__.py",
    ".*test.*",
    ".*/test/.*",
    ".*/tests/.*",
    "src/models/.*",  
]


[tool.pytest.ini_options]
addopts = "--ignore-glob='*nose2*.py'" # Ignore the nose2 files
pythonpath = [
    "src"
]
testpaths = [
    "src",
    "tests"
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "tests/*", ".venv/*", "build/*", "dist/*", "*/test/*", "*/pre_commit_test.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise AssertionError",
]
ignore_errors = true
fail_under = 50

[tool.uv.sources]
technology-template-repository = { workspace = true }


[dependency-groups]
dev = [
    "coverage>=7.6.12",
    "mypy>=1.15.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "nose2>=0.15.1",
    "ruff>=0.9.6",
    "pre-commit>=4.1.0",
    "flask",
    "flask-sqlalchemy",
    "flask-cors>=5.0.1",
    # From AI Client
    "pytest-asyncio>=0.21.1",
    "openai>=1.3.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.8.5 ",
    "dotenv>=0.9.9",
    "python-dotenv==1.1.0",
]

